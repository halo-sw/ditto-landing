<style>
  /* /new — one screen: splash → wordmark, one line, friends' rooms opened from a dock, footer with the button */
  :root { --ink: #16121B; --ink-2: #4A4352; --mute: #6E6578; --violet-d: #8A3FB8; --ease: cubic-bezier(.22,1,.36,1); --tw: clamp(240px, min(24vw, 30svh), 320px); --hue: #C5D88A; color-scheme: light; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { overflow-x: clip; }
  body { min-height: 100svh; display: flex; flex-direction: column; background: #FFFFFF; color: var(--ink); font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--violet-d); outline-offset: 4px; border-radius: 12px; }

  /* splash: the mark on violet, then a circle opens onto the page (once per visit) */
  .splash { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: linear-gradient(150deg, #8A3FB8, #AA4AF4 55%, #E07BD8); color: #FFFFFF; clip-path: circle(150% at 50% 50%); }
  .splash svg { width: 92px; height: auto; }
  .splash.go { transition: clip-path .9s cubic-bezier(.7,0,.2,1); clip-path: circle(0% at 50% 50%); }
  .splash.go svg { transition: transform .5s var(--ease), opacity .4s ease; transform: scale(.6); opacity: 0; }
  @media (prefers-reduced-motion: no-preference) { .splash svg { animation: beat 1s var(--ease) both; } }
  @keyframes beat { 0% { transform: scale(.4); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }

  main { flex: 1; overflow-x: clip; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(14px, 2.2svh, 26px); padding: clamp(28px, 5vh, 72px) 16px 24px; text-align: center; }
  /* the wordmark is the hero: ink letters with a holo band and a glare that follow the pointer (same light as the invite ticket) */
  h1 { margin: 0; line-height: 0; }
  h1 a { display: inline-block; perspective: 800px; }
  .wm { --hx: 30%; --hy: 20%; position: relative; display: block; width: clamp(200px, min(30vw, 34svh), 420px); aspect-ratio: 370 / 134; -webkit-mask: url(/assets/wordmark.svg) center / contain no-repeat; mask: url(/assets/wordmark.svg) center / contain no-repeat; transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .3s ease-out; }
  .wm i { position: absolute; inset: 0; }
  .wm .base { background: linear-gradient(160deg, #2B2036 0%, #16121B 40%, #16121B 70%, #2E2140 100%); }
  .wm .holo { mix-blend-mode: screen; opacity: .9; background: linear-gradient(115deg, rgba(255,255,255,0) 41%, rgba(250,151,226,.9) 45%, rgba(199,155,255,.95) 48.5%, rgba(255,255,255,.95) 50%, rgba(159,216,255,.9) 52%, rgba(255,255,255,0) 56%) var(--hx) var(--hy) / 260% 260%; }
  .wm .glare { mix-blend-mode: screen; background: radial-gradient(circle at var(--hx) var(--hy), rgba(236,214,255,.55), rgba(255,255,255,0) 22%); }
  .tag { font-size: clamp(17px, 1.5vw, 21px); font-weight: 700; letter-spacing: -.03em; color: var(--ink); word-break: keep-all; }
  .tag em { font-style: normal; color: var(--violet-d); }
  .sub { margin-top: -14px; font-size: clamp(14px, 1.1vw, 15.5px); color: var(--mute); }

  /* the visit: friends in a row, their room (a real app capture) in the window below; each room has its own colour */
  .visit { position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px; width: var(--tw); margin-top: clamp(4px, 1svh, 14px); }
  .visit::before { content: ""; position: absolute; z-index: -1; left: 50%; top: 58%; width: 180%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--hue) 55%, transparent), transparent); opacity: .55; transition: background .8s ease; pointer-events: none; }
  /* the dock: friends as glossy square app icons on a dark shelf (magnify under the pointer, bounce on open, a dot under the one that's open) */
  .dock { display: flex; align-items: flex-end; gap: 9px; height: 66px; padding: 9px 12px; border-radius: 22px; background: linear-gradient(180deg, #2B2B2E 0%, #161616 55%, #0E0E0F 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.14), inset 0 -1px 0 rgba(0,0,0,.6), 0 2px 0 #050505, 0 16px 34px rgba(30,10,50,.38); list-style: none; }
  .dock li { position: relative; display: flex; flex-direction: column; align-items: center; }
  .dock button, .dock a { --s: 1; position: relative; display: grid; place-items: center; width: calc(46px * var(--s)); height: calc(46px * var(--s)); padding: 0; border: 0; border-radius: 26%; overflow: hidden; background: var(--c, #2A2A2A); cursor: pointer; box-shadow: 0 1px 0 rgba(255,255,255,.08), 0 6px 10px -4px rgba(0,0,0,.7); transition: width .14s ease-out, height .14s ease-out; -webkit-tap-highlight-color: transparent; }
  .dock button img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  /* room colour pooled at the bottom, a glass highlight on top, a bevel all round */
  .dock button::before, .dock button::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; }
  .dock button::before { background: linear-gradient(180deg, rgba(255,255,255,0) 45%, color-mix(in srgb, var(--c) 70%, transparent) 100%); }
  .dock button::after { background: linear-gradient(180deg, rgba(255,255,255,.42) 0%, rgba(255,255,255,.12) 40%, rgba(255,255,255,0) 41%); box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 -2px 3px rgba(0,0,0,.28), inset 0 0 0 1px rgba(0,0,0,.18); }
  .dock li::after { content: ""; position: absolute; bottom: -7px; width: 4px; height: 4px; border-radius: 50%; background: var(--c, #FFFFFF); box-shadow: 0 0 6px var(--c, #FFFFFF); opacity: 0; transition: opacity .3s ease; }
  .dock li.open::after { opacity: 1; }
  .dock .sep { width: 1px; height: 46px; margin: 0 2px; background: linear-gradient(rgba(255,255,255,0), rgba(255,255,255,.25), rgba(255,255,255,0)); }
  .dock .sep::after { display: none; }
  /* the last icon is the app itself: same glass, no room tint */
  .dock a img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .dock a::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(180deg, rgba(255,255,255,.38) 0%, rgba(255,255,255,.1) 40%, rgba(255,255,255,0) 41%); box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 -2px 3px rgba(0,0,0,.28), inset 0 0 0 1px rgba(0,0,0,.18); }
  .dock .tip { position: absolute; bottom: calc(100% + 10px); padding: 4px 10px; border-radius: 8px; background: rgba(22,22,22,.86); color: #FFFFFF; font-size: 12.5px; font-weight: 600; white-space: nowrap; opacity: 0; transform: translateY(4px); transition: opacity .15s ease, transform .15s ease; pointer-events: none; }
  .dock li:hover .tip, .dock li:focus-within .tip { opacity: 1; transform: none; }
  .dock .bounce { animation: bounce .9s cubic-bezier(.3,0,.3,1); }
  @keyframes bounce { 0%, 100% { transform: none; } 25% { transform: translateY(-16px); } 50% { transform: none; } 70% { transform: translateY(-6px); } }
    /* the platter: a friend's handle bar + the widget board from their room (no phone chrome), other friends' cards peeking behind */
  .win { position: relative; width: 100%; }
  .win::before, .win::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 100%; height: 100%; border-radius: 30px; transform: translate(-50%, 12px) scale(.94); background: color-mix(in srgb, var(--c1) 45%, #FFFFFF); box-shadow: 0 0 0 1px rgba(22,18,27,.05); transition: background .6s ease; }
  .win::before { z-index: 0; }
  .win::after { z-index: -1; transform: translate(-50%, 24px) scale(.88); background: color-mix(in srgb, var(--c2) 35%, #FFFFFF); }
  .pl { position: relative; z-index: 1; padding: 10px; border-radius: 30px; background: #F6F4F8; box-shadow: 0 0 0 1px rgba(22,18,27,.06), 0 30px 60px -30px rgba(60,20,90,.45); }
  .pl.pop { animation: pop .55s var(--ease); }
  @keyframes pop { 0% { transform: translateY(8px) scale(.97); } 100% { transform: none; } }
  .bar { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 18px; background: linear-gradient(180deg, color-mix(in srgb, var(--hue) 70%, #FFFFFF), var(--hue)); box-shadow: inset 0 1px 0 rgba(255,255,255,.5), inset 0 -1px 0 rgba(0,0,0,.06); text-align: left; transition: background .6s ease; }
  .bar img { width: 38px; height: 38px; border-radius: 11px; object-fit: cover; box-shadow: 0 0 0 2px rgba(255,255,255,.7); }
  .bar b { display: block; font-size: 15px; font-weight: 700; letter-spacing: -.02em; color: #2A2230; }
  .bar small { display: block; font-size: 12px; color: rgba(42,34,48,.6); }
  .shot { position: relative; margin-top: 10px; aspect-ratio: 608 / 780; border-radius: 20px; overflow: hidden; -webkit-mask: linear-gradient(#000 84%, transparent); mask: linear-gradient(#000 84%, transparent); }
  /* the capture minus status bar, handle bar and the hairline of bezel on both sides */
  .shot img { position: absolute; left: -2.63%; top: 0; width: 105.26%; height: auto; margin-top: -28.3%; }
  .shot img.next { opacity: 0; }
  .shot img.in { opacity: 1; transition: opacity .45s ease; }
  .cap { margin-bottom: 2px; font-size: 14px; color: var(--mute); }
  .win + .dock { margin-top: 26px; }

  .foot { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px 20px; padding: 18px 28px calc(18px + env(safe-area-inset-bottom)); font-size: 13.5px; }
  .foot .legal { color: var(--mute); line-height: 1.6; }
  .foot .legal a:hover, .foot nav a:hover { color: var(--ink); }
  .foot nav { display: flex; gap: 28px; font-weight: 600; }
  .btn { justify-self: end; display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 22px; border-radius: 14px; background: var(--ink); color: #FFFFFF; font-size: 15.5px; font-weight: 700; transition: transform .3s var(--ease); }
  .btn:hover { transform: translateY(-2px); }
  .btn small { font-size: 11px; font-weight: 600; opacity: .7; display: block; line-height: 1; margin-bottom: 3px; }
  .btn span { display: block; line-height: 1.1; text-align: left; }

  @media (prefers-reduced-motion: no-preference) {
    main > * { animation: up .9s var(--ease) both; animation-play-state: var(--play, running); }
    main > :nth-child(2) { animation-delay: .1s; } main > :nth-child(3) { animation-delay: .12s; } main > :nth-child(4) { animation-delay: .2s; }
  }
  @keyframes up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @media (max-width: 760px) {
    :root { --tw: min(300px, 74vw); }
    .dock { gap: 6px; height: 58px; padding: 8px 10px; }
    .dock button, .dock a { width: 38px; height: 38px; }
    .dock .sep { height: 38px; }
    .foot { grid-template-columns: 1fr; justify-items: center; text-align: center; padding-inline: 16px; }
    .btn { justify-self: stretch; justify-content: center; height: 54px; order: -1; }
    .foot nav { order: 0; }
    .foot .legal { order: 1; }
  }
</style>

  <main>

<script>
  (function(){
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    // splash once per visit
    const sp = document.getElementById('splash');
    let seen = false; try { seen = sessionStorage.getItem('ditto.new.splash') === '1'; sessionStorage.setItem('ditto.new.splash', '1'); } catch (e) {}
    if (!reduce && !seen) {
      sp.hidden = false; document.documentElement.style.setProperty('--play', 'paused');
      setTimeout(() => { sp.classList.add('go'); document.documentElement.style.setProperty('--play', 'running'); }, 1100);
      setTimeout(() => sp.remove(), 2100);
    } else sp.remove();

    // wordmark light: follows the pointer anywhere on the page; drifts on its own on touch screens or when the pointer rests
    const wm = document.getElementById('wm');
    if (!reduce) {
      let last = 0, raf = 0;
      const light = (x, y) => { wm.style.setProperty('--hx', (x * 100).toFixed(1) + '%'); wm.style.setProperty('--hy', (y * 100).toFixed(1) + '%'); };
      addEventListener('pointermove', e => { if (e.pointerType !== 'mouse') return; last = performance.now(); const r = wm.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height; light(Math.max(-.2, Math.min(1.2, x)), Math.max(-.2, Math.min(1.2, y))); const dx = Math.max(-1, Math.min(1, x - .5)), dy = Math.max(-1, Math.min(1, y - .5)); wm.style.setProperty('--rx', (-dy * 10).toFixed(2) + 'deg'); wm.style.setProperty('--ry', (dx * 14).toFixed(2) + 'deg'); }, { passive: true });
      const drift = t => { raf = requestAnimationFrame(drift); if (performance.now() - last < 2500 || document.hidden) return; const q = (t / 3200) % 1; light(-.1 + q * 1.2, .25 + Math.sin(q * Math.PI * 2) * .2); };
      raf = requestAnimationFrame(drift);
    }

    // friends' platters: one every few seconds, or the one picked from the dock
    const F = [
      { id: '03-sora', av: 'sora', n: '소라', h: 'sora.maybe', c: '#C5D88A', a: '‘🧺 간식 부자’, ‘🧺 각자 좋아하는 간식 하나’, ‘🫶 같은 표정’, ‘🍒 돗자리 챙겨 둠’' },
      { id: '07-jiu', av: 'jiu-1', n: '지우', h: 'jiu.all.day', c: '#F29BC0', a: '‘🩰 한 번 더’, ‘🪩 목 20시’, ‘🩰 발레 가는 일상’, ‘쇼케이스 D−15’' },
      { id: '01-haeun', av: 'haeun', n: '하은', h: 'haeun.zip', c: '#B69CF0', a: '‘🫧 여긴 조금 천천히 채울래’, ‘☕ 삐뚤어도 손에 맞는 내 컵’, ‘📚 이번 주 작은 일’, ‘첫 혼자 서점 D−8’' },
      { id: '04-jaemin', av: 'jaemin', n: '재민', h: 'jaemin.archive', c: '#6FA4B0', a: '‘📖 책 읽는 오후’, ‘돌아오는 기차에서 🚃’, ‘🌊 다시 바다’, ‘다음 출사 D−15’' },
      { id: '05-nari', av: 'nari-1', n: '나리', h: 'nari.day', c: '#D6B65E', a: '‘☕ 삐뚤어도 손에 맞는 내 컵’, ‘🫖 내 첫 컵’, ‘🥐 쉬는 날 빵집 투어’, ‘첫 컵 픽업 D−6’' },
      { id: '02-jun', av: 'jun', n: '준', h: 'jun.is.here', c: '#9AA7B8', a: '‘🥐 공강 한 시간은 커피로’, ‘📸 흔들린 컷도 보내 줄게’, ‘중간고사 끝 D−7’, ‘잔불 (Still)’ 음악' }
    ];
    const src = f => '/assets/rooms/room-' + f.id + '.webp';
    const dock = document.getElementById('dock'), win = document.getElementById('win'), pl = document.getElementById('pl'), shot = document.getElementById('shot'), nm = document.getElementById('nm'), hd = document.getElementById('hd'), bav = document.getElementById('bav'), hn = document.getElementById('hn'), visit = document.getElementById('visit');
    let img = shot.querySelector('img');
    const items = F.map((f, j) => {
      const li = document.createElement('li'), b = document.createElement('button');
      li.style.setProperty('--c', f.c);
      b.type = 'button'; b.setAttribute('role', 'tab'); b.setAttribute('aria-label', f.n + '의 방');
      b.innerHTML = `<img src="/assets/rooms/rav-${f.av}.webp" alt="" width="46" height="46">`;
      b.addEventListener('click', () => { hn.textContent = '위젯으로 꾸민 친구의 하루예요'; bounce(b); if (j !== k) show(j); });
      li.innerHTML = `<span class="tip">${f.n}</span>`; li.prepend(b); dock.appendChild(li); return li;
    });
    dock.insertAdjacentHTML('beforeend', '<li class="sep" aria-hidden="true"></li><li class="app"><a href="/#tm" aria-label="앱 다운받기 · 출시 초대장 받기"><img src="/apple-touch-icon.png" alt="" width="46" height="46"></a><span class="tip">앱 다운받기</span></li>');
    F.forEach(f => { const i = new Image(); i.src = src(f); });
    const bounce = el => { if (reduce) return; el.classList.remove('bounce'); void el.offsetWidth; el.classList.add('bounce'); };

    // magnify like the macOS dock: icons near the pointer grow, the rest stay put
    const fine = matchMedia('(hover: hover) and (pointer: fine)').matches;
    const icons = [...dock.querySelectorAll('button, a')];
    if (fine && !reduce) {
      dock.addEventListener('pointermove', e => icons.forEach(el => { const r = el.getBoundingClientRect(), d = Math.abs(e.clientX - (r.left + r.width / 2)); el.style.setProperty('--s', (1 + .5 * Math.max(0, 1 - d / 96)).toFixed(3)); }));
      dock.addEventListener('pointerleave', () => icons.forEach(el => el.style.setProperty('--s', 1)));
    }

    const STAY = 3800;
    let k = 0, held = false, timer = 0;
    const alt = f => f.n + '의 플래터. ' + f.a + ' 등이 위젯으로 붙어 있어요.';
