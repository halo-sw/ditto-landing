<style>
  @font-face {
    font-family: "PP Pangram Rounded";
    src: url("/assets/font-1.woff2") format("woff2");
    font-weight: 600; font-style: italic; font-display: swap;
  }
  @font-face {
    font-family: "Pretendard SemiBold";
    src: url("/assets/font-2.woff2") format("woff2");
    font-weight: 600; font-display: swap;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    /* 뷰포트 높이에 맞춰 폰 목업 크기가 유동 — 풀스크린에서 스크롤 없이 채움 */
    --phone-w: clamp(210px, 30vh, 290px);
  }
  html, body { height: 100%; }
  body {
    font-family: "Pretendard SemiBold", -apple-system, sans-serif;
    background: linear-gradient(180deg, #b46ce0 0%, #e087e6 22%, #f79fdf 44%, #fdd9f1 62%, #ffffff 82%);
    min-height: 100svh; overflow-x: hidden;
  }
  .stage {
    min-height: 100svh; width: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: clamp(20px, 4vh, 40px) 20px clamp(24px, 4vh, 48px);
    gap: clamp(14px, 2.4vh, 30px);
  }
  .dock {
    background: #161616; border-radius: 24px;
    padding: 11px 13px; display: flex; gap: clamp(6px, 1vw, 11px); flex-shrink: 0;
    box-shadow: 0 14px 34px rgba(30,10,50,.35);
    max-width: 100%;
  }
  .dock img {
    width: clamp(30px, 9vw, 52px); height: clamp(30px, 9vw, 52px);
    border-radius: 12px; display: block; cursor: pointer;
    transition: transform .18s ease, filter .18s ease; -webkit-tap-highlight-color: transparent;
  }
  .dock img:hover { transform: translateY(-3px); }
  .dock img.active { transform: translateY(-4px); filter: drop-shadow(0 6px 10px rgba(0,0,0,.3)); }
  .type-line {
    height: 1.4em; min-height: 24px;
    font-family: "PP Pangram Rounded", sans-serif; font-style: italic;
    font-size: clamp(15px, 1.4vw, 17px); color: #fff; letter-spacing: .01em;
  }
  .phone-wrap {
    position: relative; overflow: hidden; flex-shrink: 0;
    width: var(--phone-w);
    height: clamp(300px, 52vh, 460px);
    -webkit-mask-image: linear-gradient(180deg, #000 55%, transparent 95%);
    mask-image: linear-gradient(180deg, #000 55%, transparent 95%);
  }
  .phone-wrap img {
    width: var(--phone-w); display: block; position: absolute; top: 0; left: 50%;
    transform: translateX(-50%); transition: opacity .35s ease;
  }
  .phone-wrap img.hidden { opacity: 0; }
  .count {
    font-family: "PP Pangram Rounded", sans-serif; font-style: italic;
    font-size: clamp(22px, 2.2vw, 28.8px); color: #8c5f5f; letter-spacing: .02em; flex-shrink: 0;
  }
  form { display: flex; gap: 14px; align-items: stretch; flex-shrink: 0; }
  input {
    width: clamp(220px, 26vw, 340px); height: 52px; padding: 0 18px;
    border: 1px solid #e2e2e6; border-radius: 10px; background: #f5f5f7;
    font-family: inherit; font-size: 15px; color: #1c1c22; outline: none;
  }
  input::placeholder { color: #a8a8b0; }
  input:focus { border-color: #b46ce0; background: #fff; }
  button {
    height: 52px; padding: 0 26px; border: none; border-radius: 12px;
    background: #b255d9; color: #fff; font-family: "Pretendard SemiBold", sans-serif;
    font-size: 16px; cursor: pointer; transition: background .18s ease; white-space: nowrap;
  }
  button:hover { background: rgba(134, 61, 166, .85); }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .6; }
  .msg { min-height: 20px; font-size: 13px; color: #8c5f5f; text-align: center; flex-shrink: 0; }

  /* 완료 팝업 */
  .modal-back {
    position: fixed; inset: 0; background: rgba(40, 16, 60, .38);
    backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center;
    padding: 24px; z-index: 50; opacity: 0; pointer-events: none; transition: opacity .22s ease;
  }
  .modal-back.show { opacity: 1; pointer-events: auto; }
  .modal {
    width: 100%; max-width: 360px; background: #fff; border-radius: 26px;
    padding: 40px 28px 28px; text-align: center;
    box-shadow: 0 24px 70px rgba(60, 30, 110, .28);
    transform: translateY(12px) scale(.97); transition: transform .24s cubic-bezier(.2,.9,.3,1.2);
  }
  .modal-back.show .modal { transform: translateY(0) scale(1); }
  .modal .emoji { font-size: 46px; margin-bottom: 14px; }
  /* 왁스로 봉인한 편지 — 앱 Views/WaxSeal.swift와 같은 모양 · 키 컬러 무작위 */
  .letter { position: relative; width: 176px; height: 113px; margin: -8px auto 22px; border-radius: 10px;
    background: linear-gradient(#FFFDF8, #F4EDE2); box-shadow: 0 8px 28px rgba(60,30,110,.16); }
  .letter .flap { position: absolute; inset: 2px 4px auto; height: 63px; background: linear-gradient(#FBF6EC, #EDE3D3);
    clip-path: polygon(0 0, 100% 0, 50% 100%); filter: drop-shadow(0 1.5px 2px rgba(0,0,0,.08)); }
  .letter .seal, .letter .stamp { position: absolute; left: 50%; top: 63px; width: 54px; height: 54px; margin: -27px 0 0 -27px; }
  .letter .stamp { opacity: 0; pointer-events: none; }
  .letter .imprint { opacity: 0; }
  .letter.sealed .imprint { opacity: 1; }
  .modal .title { font-family: "PretendardB", "Pretendard SemiBold", sans-serif; font-size: 21px; font-weight: 700; color: #1c1c22; margin-bottom: 10px; }
  .modal .body { font-size: 14px; color: #6b6b76; line-height: 1.6; }
  .modal .ok {
    margin-top: 26px; width: 100%; height: 52px; border: none; border-radius: 14px;
    background: #b255d9; color: #fff; font-family: "Pretendard SemiBold", sans-serif;
    font-size: 16px; cursor: pointer; transition: background .18s ease;
  }
  .modal .ok:hover { background: rgba(134, 61, 166, .9); }
  .modal .ok:active { transform: scale(.98); }

  /* 세로 모바일: 폼 세로 적층 */
  @media (max-width: 640px) {
    form { flex-direction: column; width: 100%; max-width: 340px; }
    input, button { width: 100%; }
  }
  /* 가로가 낮은 화면(가로 모바일·짧은 창): 폰을 더 줄이고 여백 압축 */
  @media (max-height: 620px) {
    :root { --phone-w: clamp(150px, 24vh, 210px); }
    .stage { gap: clamp(8px, 1.6vh, 16px); }
    .phone-wrap { height: clamp(180px, 34vh, 300px); }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="dock" id="dock">
      <img src="/assets/icon-1.png" data-phone="1" alt="ditto 화면 1">
      <img src="/assets/icon-2.png" data-phone="2" alt="ditto 화면 2">
      <img src="/assets/icon-3.png" data-phone="3" alt="ditto 화면 3">
      <img src="/assets/icon-4.png" data-phone="4" alt="ditto 화면 4">
      <img src="/assets/icon-5.png" data-phone="5" alt="ditto 화면 5">
      <img src="/assets/icon-6.png" data-phone="2" alt="ditto 화면 6">
      <img src="/assets/icon-7.png" data-phone="1" alt="ditto 화면 7">
    </div>
    <div class="type-line"><span id="type"></span>&thinsp;_</div>
    <div class="phone-wrap">
      <img id="phoneA" src="/assets/phone-1.png" alt="ditto! 앱 화면">
      <img id="phoneB" class="hidden" alt="" aria-hidden="true">
    </div>
    <div class="count" id="count">00:00:00:00</div>
    <form id="wl">
      <input type="email" id="email" placeholder="name@email.com" autocomplete="email">
      <button type="submit" id="btn">출시알림 받기</button>
    </form>
    <div class="msg" id="msg"></div>
  </main>

  <div class="modal-back" id="modalBack">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="emoji" id="modalEmoji" hidden></div>
      <div class="letter" id="letter" aria-hidden="true"></div>
      <div class="title" id="modalTitle">완료되었어요!</div>
      <div class="body" id="modalBody">출시 소식을 가장 먼저 보내드릴게요.</div>
      <button class="ok" id="modalOk">확인</button>
    </div>
  </div>
<script>
  // 타이프라이터 — Framer 원본 문구 (실측: 타이핑 52ms · 삭제 137ms · 휴지 2s)
  const PHRASES = ["This is all about", "Catch ya on Ditto!", "❤️‍🔥🍞🌎🤍⭐️"];
  const typeEl = document.getElementById('type');
  let pi = 0, ci = 0, deleting = false;
  function tick() {
    const p = [...PHRASES[pi]];
    if (!deleting) {
      ci++;
      if (ci >= p.length) { deleting = true; typeEl.textContent = p.join(''); setTimeout(tick, 2000); return; }
    } else {
      ci--;
      if (ci <= 0) { deleting = false; pi = (pi + 1) % PHRASES.length; }
    }
    typeEl.textContent = p.slice(0, ci).join('');
    setTimeout(tick, deleting ? 137 : 52);
  }
  tick();

  // 독 아이콘 클릭 → 폰 화면 전환 (A/B 크로스페이드)
  const phoneA = document.getElementById('phoneA'), phoneB = document.getElementById('phoneB');
  let front = phoneA, back = phoneB, current = '1';
  document.getElementById('dock').addEventListener('click', e => {
    const icon = e.target.closest('img[data-phone]');
    if (!icon) return;
    const n = icon.dataset.phone;
    document.querySelectorAll('#dock img').forEach(i => i.classList.toggle('active', i === icon));
    if (n === current) return;
    current = n;
    back.onload = () => {
      back.classList.remove('hidden');
      front.classList.add('hidden');
      [front, back] = [back, front];
    };
    back.src = `/assets/phone-${n}.png`;
  });

  // 카운트다운 — 출시일 확정 시 LAUNCH_AT을 ISO 문자열로 (null이면 00:00:00:00 고정)
  const LAUNCH_AT = null; // 예: "2026-09-01T00:00:00+09:00"
  const countEl = document.getElementById('count');
  const pad = n => String(n).padStart(2, '0');
  function updateCount() {
    if (!LAUNCH_AT) return;
    const diff = Math.max(0, new Date(LAUNCH_AT) - new Date());
    const d = Math.floor(diff / 86400000), h = Math.floor(diff / 3600000) % 24,
          m = Math.floor(diff / 60000) % 60, s = Math.floor(diff / 1000) % 60;
    countEl.textContent = `${pad(d)}:${pad(h)}:${pad(m)}:${pad(s)}`;
  }
  updateCount(); setInterval(updateCount, 1000);

  // 출시알림 — Supabase waitlist (publishable key, RLS: insert만 허용)
  const SB = "https://lisqekczixwzshmpewzq.supabase.co/rest/v1/waitlist";
  const KEY = "sb_publishable_wZhXPAWXra62J60VkWJlhQ_2OPv-Zpf";
  const form = document.getElementById('wl'), btn = document.getElementById('btn'),
        email = document.getElementById('email'), msg = document.getElementById('msg');
  const modalBack = document.getElementById('modalBack');
  // ── 왁스 실링 (키 컬러 8색 중 무작위 · 앱 WaxSeal.swift와 같은 층: 그림자 · 붓기 · 테두리 · 눌린 홈 · d! · 광택)
  const WAX_KEYS = ['#AA4AF4', '#D6AEFF', '#27E5F2', '#FA97E2', '#FF925D', '#FF5488', '#F9F871', '#B0DE33'];
  const MARK = '<path d="M176.5 20.19C176.5 20.19 151.49.35 97.66 0c-3.3 19.16-9.32 51.31-16.36 89.51-2.21-34.84-22.14-40.87-33.03-38.61C21.33 56.5-9.03 106.4 2.52 142.17c11.64 36.06 63.98 27.7 85.47 23.28-.04-.11-.06-.22-.1-.33-.4-36.3 4.16-86.42 36.74-117.42 14.45-13.75 37.15-26.47 51.88-27.5ZM67.08 146.17c-4.52 4.98-14.64-1.76-23.67-13.6-18.58-24.36-17.7-51.67-4.25-51.83 7.29-.1 14.45 5.46 22.06 28.37 4.49 13.51 8.57 34.08 5.86 37.06Z"/><path d="M154 156.05c-2.67 2.69-6.58 2.88-8.53-2.3-1.09-2.9-3.78-9.66-10.83-18.77-3.79-4.9-10.92-12.32-15.45-20.93-4.85-9.23-5.81-14.45-5.04-22.28 1.01-10.12 11.11-22.64 25.18-21.77 24.68 1.52 22.84 33.93 22.84 33.93s14.64-30.87 38.11-20.76c12.93 5.57 15.61 22.12 12.6 30.89-5.92 17.21-27.88 23.96-36.27 28.02-12.64 6.1-16.11 7.43-22.62 13.98Z"/><circle cx="141.59" cy="187.2" r="16.7"/>';
  const BLOB = (seed => { let st = BigInt(seed) | 1n; const M = (1n << 64n) - 1n;
    const rnd = () => { st = (st * 6364136223846793005n + 1442695040888963407n) & M; return Number((st >> 33n) % 10000n) / 10000; };
    const waves = [0, 1, 2, 3].map(() => [Math.floor(rnd() * 4) + 2, rnd() * Math.PI * 2, rnd()]);
    const n = 72, r = 50 * 0.93, pts = [];
    for (let i = 0; i < n; i++) { const t = i / n * Math.PI * 2; let d = 0; waves.forEach(([k, ph, a]) => d += Math.sin(t * k + ph) * a);
      const rr = r * (1 + 0.07 * d / 2); pts.push([50 + Math.cos(t) * rr, 50 + Math.sin(t) * rr]); }
    const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], f = v => v.toFixed(2);
    let m = mid(pts[n - 1], pts[0]), d = `M${f(m[0])} ${f(m[1])}`;
    for (let i = 0; i < n; i++) { const e = mid(pts[i], pts[(i + 1) % n]); d += ` Q${f(pts[i][0])} ${f(pts[i][1])} ${f(e[0])} ${f(e[1])}`; }
    return d + 'Z'; });
  function waxTone(hex, b, sat = 1) {   // 밝기·채도 비율 (HSV)
    const n = parseInt(hex.slice(1), 16), r = (n >> 16) / 255, g = (n >> 8 & 255) / 255, bl = (n & 255) / 255;
    const mx = Math.max(r, g, bl), mn = Math.min(r, g, bl), dl = mx - mn; let h = 0;
    if (dl) { h = mx === r ? ((g - bl) / dl) % 6 : mx === g ? (bl - r) / dl + 2 : (r - g) / dl + 4; h /= 6; if (h < 0) h += 1; }
    const s = Math.min(1, (mx ? dl / mx : 0) * sat), v = Math.min(1, mx * b), i = Math.floor(h * 6), fr = h * 6 - i,
          p = v * (1 - s), q = v * (1 - fr * s), t = v * (1 - (1 - fr) * s), c = [[v, t, p], [q, v, p], [p, v, t], [p, q, v], [t, p, v], [v, p, q]][i % 6];
    return '#' + c.map(x => Math.round(x * 255).toString(16).padStart(2, '0')).join('');
  }
  function sealSVG(hex, seed) {
    const L = waxTone(hex, 1.25, .8), D = waxTone(hex, .62, 1.1), Mi = waxTone(hex, .88), E = waxTone(hex, .8), u = 'w' + seed, path = BLOB(seed);
    return `<svg class="seal" viewBox="0 0 100 100" overflow="visible"><defs>
      <radialGradient id="${u}p" cx=".36" cy=".3" r=".62"><stop offset="0" stop-color="${L}"/><stop offset=".5" stop-color="${hex}"/><stop offset="1" stop-color="${D}"/></radialGradient>
      <linearGradient id="${u}e" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="${D}" stop-opacity=".6"/></linearGradient>
      <linearGradient id="${u}r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${L}"/><stop offset=".5" stop-color="${Mi}"/><stop offset="1" stop-color="${D}"/></linearGradient>
      <linearGradient id="${u}c" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${D}"/><stop offset=".5" stop-color="${Mi}"/><stop offset="1" stop-color="${waxTone(hex, 1.08)}"/></linearGradient>
      <filter id="${u}b"><feGaussianBlur stdDeviation="3"/></filter><filter id="${u}h"><feGaussianBlur stdDeviation="2.4"/></filter></defs>
      <path d="${path}" fill="${D}" opacity=".55" transform="translate(0 3.5)" filter="url(#${u}b)"/>
      <path class="pour" d="${path}" fill="url(#${u}p)" stroke="url(#${u}e)" stroke-width="2.8"/>
      <g class="imprint"><circle cx="50" cy="50" r="35" fill="none" stroke="url(#${u}r)" stroke-width="6.5"/>
        <circle cx="50" cy="50" r="31" fill="url(#${u}c)"/><circle cx="50" cy="50" r="30.4" fill="none" stroke="${D}" stroke-opacity=".7" stroke-width="2" filter="url(#${u}h)"/>
        <g transform="translate(33.2 34) scale(.157)"><g fill="${L}" opacity=".9" transform="translate(7.6 8.9)">${MARK}</g><g fill="${D}" transform="translate(-6.4 -7.6)">${MARK}</g><g fill="${E}">${MARK}</g></g></g>
      <ellipse cx="34" cy="27" rx="13" ry="5.5" fill="#fff" opacity=".5" transform="rotate(-32 34 27)" filter="url(#${u}h)"/></svg>`;
  }
  const STAMP = '<svg class="stamp" viewBox="0 0 100 100"><defs><radialGradient id="br" cx=".35" cy=".3" r=".6"><stop offset="0" stop-color="#F6DE8D"/><stop offset=".55" stop-color="#C9A042"/><stop offset="1" stop-color="#7E5A1C"/></radialGradient><radialGradient id="wd" cx=".35" cy=".3" r=".6"><stop offset="0" stop-color="#A8704A"/><stop offset="1" stop-color="#5A3420"/></radialGradient></defs><circle cx="50" cy="50" r="41" fill="url(#br)" stroke="#5E4214" stroke-opacity=".6" stroke-width="1.5"/><circle cx="50" cy="50" r="20" fill="url(#wd)"/></svg>';
  function sealLetter(animate) {
    const el = document.getElementById('letter'), seed = 1 + Math.floor(Math.random() * 2 ** 30), hex = WAX_KEYS[Math.floor(Math.random() * WAX_KEYS.length)];
    el.className = 'letter'; el.innerHTML = '<div class="flap"></div>' + sealSVG(hex, seed) + STAMP;
    const seal = el.querySelector('.seal'), stamp = el.querySelector('.stamp');
    if (!animate || matchMedia('(prefers-reduced-motion: reduce)').matches || !seal.animate) { el.classList.add('sealed'); return; }
    seal.animate([{ transform: 'scale(.3)', opacity: 0 }, { transform: 'scale(1.06)', opacity: 1, offset: .6 }, { transform: 'scale(1)', opacity: 1 }], { duration: 550, easing: 'ease-out', fill: 'both' });
    stamp.animate([{ transform: 'translateY(-76px) scale(1.45)', opacity: 0 }, { transform: 'translateY(-60px) scale(1.35)', opacity: 1, offset: .1 }, { transform: 'none', opacity: 1 }],
      { duration: 280, delay: 500, easing: 'ease-in', fill: 'both' }).finished.then(() => {
      el.classList.add('sealed');
      seal.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.06, .94)' }, { transform: 'scale(1)' }], { duration: 320, easing: 'ease-out' });
      if (navigator.vibrate) navigator.vibrate(12);
      stamp.animate([{ transform: 'none', opacity: 1 }, { transform: 'translateY(-76px) scale(1.45)', opacity: 0 }], { duration: 400, delay: 220, easing: 'ease-out', fill: 'both' });
    });
  }
  function showModal(emoji, title, body) {
    sealLetter(emoji === '💌');   // 처음 신청 = 봉인 동작 · 이미 신청 = 찍힌 편지만
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').textContent = body;
    modalBack.classList.add('show');
  }
  function closeModal() { modalBack.classList.remove('show'); }
  document.getElementById('modalOk').addEventListener('click', closeModal);
  modalBack.addEventListener('click', e => { if (e.target === modalBack) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  form.addEventListener('submit', async e => {
    e.preventDefault();
    btn.disabled = true; msg.textContent = '';
    try {
      // 앱 + 랜딩 이메일 통합 명단 (join_email_waitlist · 출처 landing_download) — 서버에 없으면 예전처럼 표에 바로 넣는다
      let r = await fetch(SB.replace('/waitlist', '/rpc/join_email_waitlist'), {
        method: 'POST',
        headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_email: email.value.trim(), p_source: 'landing_download' })
      });
      if (r.ok) {
        const res = await r.json();
        r = { status: res === 'added' ? 201 : res === 'already' ? 409 : 400 };
      } else if (r.status === 404) {
        r = await fetch(SB, {
          method: 'POST',
          headers: { apikey: KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email.value.trim() })
        });
      }
      if (r.status === 201) { showModal('💌', '완료되었어요!', '출시 소식을 가장 먼저 보내드릴게요.'); form.reset(); }
      else if (r.status === 409) { showModal('🙌', '이미 신청했어요', '출시되면 이 이메일로 알려드릴게요.'); }
      else { msg.textContent = '잠시 후 다시 시도해주세요.'; }
    } catch { msg.textContent = '네트워크 연결을 확인해주세요.'; }
    btn.disabled = false;
  });
</script>
</body>
</html>
