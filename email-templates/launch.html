<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>ditto!가 드디어 출시됐어요</title>
<!--[if mso]>
<style>body,table,td{font-family:'Malgun Gothic',sans-serif !important;}</style>
<![endif]-->
</head>
<body style="margin:0; padding:0; background-color:#f2eefb; -webkit-text-size-adjust:100%;">
  <div style="display:none; max-height:0; overflow:hidden; opacity:0;">
    기다려주셔서 고마워요. ditto!가 App Store에 출시됐어요. 지금 다운로드하세요!
  </div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f2eefb;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px; background-color:#ffffff; border-radius:24px; overflow:hidden;">
          <!-- 히어로 (브랜드 카드) -->
          <tr>
            <td align="center" background="#b46ce0" style="background-color:#b46ce0; background-image:linear-gradient(160deg,#a86ee0 0%,#d585dd 55%,#f7a6d6 100%); padding:44px 24px 40px;">
              <img src="https://ditto.at/email/wordmark-white.png" width="150" alt="ditto!" style="display:block; width:150px; height:auto; border:0; margin-bottom:24px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" bgcolor="#ffffff" style="border-radius:100px; padding:9px 22px; font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size:14px; font-weight:700; color:#7e37c2;">
                    &#127881;&nbsp; 드디어 출시됐어요
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <!-- 본문 -->
          <tr>
            <td align="center" style="padding:38px 36px 8px;">
              <h1 style="margin:0 0 14px; font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size:26px; font-weight:700; line-height:1.35; color:#1c1c22;">
                기다려주셔서 고마워요.<br>이제 ditto!를 시작해요
              </h1>
              <p style="margin:0; font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size:15px; line-height:1.7; color:#6b6b76;">
                위젯으로 서로의 하루를 주고받는 친구들의 공간.<br>
                지금 앱을 내려받고 친구를 초대해보세요.
              </p>
            </td>
          </tr>
          <!-- 폰 미리보기 -->
          <tr>
            <td align="center" style="padding:28px 36px 4px;">
              <img src="https://ditto.at/email/phone.png" width="220" alt="ditto! 앱 화면" style="display:block; width:220px; height:auto; border:0; border-radius:22px;">
            </td>
          </tr>
          <!-- 다운로드 버튼 -->
          <tr>
            <td align="center" style="padding:28px 36px 10px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" bgcolor="#b255d9" style="border-radius:14px;">
                    <a href="{{app_store_url}}" target="_blank" style="display:inline-block; padding:17px 52px; font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size:16px; font-weight:700; color:#ffffff; text-decoration:none; border-radius:14px;">
                      App Store에서 다운로드
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:0 36px 38px;">
              <p style="margin:0; font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size:13px; color:#9a9aa4;">
                받으신 <b style="color:#7e37c2;">초대코드</b>를 가입할 때 입력하면 바로 시작할 수 있어요.
              </p>
            </td>
          </tr>
          <!-- 푸터 -->
          <tr>
            <td align="center" style="padding:28px 36px 34px; border-top:1px solid #f0ecf7;">
              <p style="margin:0 0 6px; font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size:12px; color:#a8a8b4;">
                통하면, 디토해! &nbsp;&middot;&nbsp; <a href="https://ditto.at" style="color:#a8a8b4; text-decoration:underline;">ditto.at</a>
              </p>
              <p style="margin:0; font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size:11px; color:#c2c2cc;">
                이 메일은 사전신청하신 분께 발송되었어요. &nbsp;<a href="{{unsubscribe_url}}" style="color:#c2c2cc; text-decoration:underline;">수신거부</a>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
