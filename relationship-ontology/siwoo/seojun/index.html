<style>
/* Layout: one screen. Controls on top; persona and the day's notifications on the left, the map with a 6-month timeline in the middle, summary · people · review tabs on the right. Anything that stands for a relationship opens its card.
   Look follows ditto.place: white page, lavender cards, black pill for the chosen option, violet gradient for the main action and highlighted words, Nunito italic for numbers. Both personas share every slot so switching never moves the layout. */
@font-face{font-family:"Pretendard Sim";src:url("assets/pretendard-sim.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{
  --bg:#FFFFFF; --bg-2:#F5F2F8; --bg-3:#ECE6F1; --stage:#F6F0FB;
  --ink:#16121B; --ink-2:#4A4352; --mute:#6E6578; --faint:#A79FB1;
  --line:rgba(22,18,27,.1); --night:#161616;
  --violet:#AA4AF4; --violet-d:#8A3FB8; --tonal:#F1E4FC;
  --grad:linear-gradient(135deg,#AA4AF4,#8A3FB8); --mark:linear-gradient(100deg,#7B3BC4 0%,#AA4AF4 48%,#E569C6 100%);
  --shadow:0 10px 28px -16px rgba(90,20,120,.32);
  --r-lg:20px; --r-md:14px;
  --kr:"Pretendard Sim","Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --round:"Nunito","Arial Rounded MT Bold",system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --gx:max(16px,env(safe-area-inset-left,0px)); --gxr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--kr);-webkit-font-smoothing:antialiased;word-break:keep-all;letter-spacing:-.01em;overflow:hidden}
button{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
.sub{color:var(--mute)}
mark{padding:0;color:transparent;background:var(--mark);-webkit-background-clip:text;background-clip:text}
.disp{font-family:var(--round);font-style:italic;font-weight:900;letter-spacing:-.015em}
.lab{display:inline-flex;align-items:baseline;gap:8px;font:italic 800 12px/1.3 var(--round);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.lab b{font-weight:900;color:var(--violet-d);letter-spacing:0}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding:12px var(--gxr) 12px var(--gx);border-bottom:1px solid var(--line);background:var(--bg)}
.brand{display:flex;align-items:center;gap:16px;margin-right:auto}
.brand a{display:flex;flex:none;border-radius:8px}
.brand img{height:22px;width:auto;filter:brightness(0);flex:none}
.brand h1{display:flex;flex-direction:column;gap:2px;font:700 18px/24px var(--kr);letter-spacing:-.03em;color:var(--ink)}
.brand h1 .lab{font-size:11px}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.ctl .g{display:flex;align-items:center;gap:8px}
.ctl .g > span{font:600 12px/16px var(--kr);color:var(--mute);white-space:nowrap}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line),0 6px 18px -14px rgba(90,20,120,.35)}
.seg button{height:30px;padding:0 13px;border:0;border-radius:999px;background:none;color:var(--ink-2);font:600 13px/18px var(--kr);cursor:pointer;white-space:nowrap;transition:background .25s,color .25s}
.seg button:hover{background:var(--bg-2)}
.seg button[aria-pressed="true"]{background:var(--night);color:#FFFFFF}
.seg button:disabled{color:var(--faint);cursor:default;background:none}
.seg.big button{height:38px;padding:0 16px;font:700 14px/19px var(--kr)}
.g.off > span{color:var(--faint)}

.main{display:grid;grid-template-columns:300px minmax(0,1fr) 360px;min-height:0}
.pane{min-height:0;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px;scrollbar-width:thin;background:var(--bg)}
.pane.l{border-right:1px solid var(--line)}
.pane.r{border-left:1px solid var(--line);padding:0;gap:0}
.av{display:block;border-radius:25%;object-fit:cover;flex:none}
.me{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-radius:var(--r-lg);background:var(--bg-2);border:0;width:100%;height:76px;text-align:left;cursor:pointer;transition:background .25s}
.me:hover{background:var(--bg-3)}
.me .av{width:48px;height:48px}
.me > span{min-width:0}
.me b{display:block;font:700 16px/22px var(--kr);color:var(--ink)}
.me span span{display:block;font:400 12px/16px var(--kr);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me i{font-style:normal;color:var(--violet-d);font-size:12px;font-weight:700;white-space:nowrap}
.date .dd{font:italic 900 44px/52px var(--round);letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums;display:block}
.date .dd small{font:italic 800 15px/19px var(--round);color:var(--mute);margin-left:4px}
.date .ph{display:flex;gap:8px;align-items:center;font:500 13px/18px var(--kr);color:var(--ink-2);height:24px}
.phc{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:var(--bg-2);font:600 12px/16px var(--kr);color:var(--ink-2)}
.phc i{width:6px;height:6px;border-radius:50%;background:var(--violet)}
.phc.vac i{background:#48B5F4}
.phc.exam i{background:#A79FB1}
.lv{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font:600 12px/16px var(--kr);white-space:nowrap}
.lv0{background:#EFEBF3;color:#6E6578}
.lv1{background:#E3EFFC;color:#2B6CB0}
.lv2{background:#DDF5EE;color:#0F7A60}
.lv3{background:#EDE3FC;color:#7438C2}
.lv4{background:#FCE3F1;color:#B5307D}
.feed h4{font:700 14px/19px var(--kr);color:var(--ink);display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.feed h4 small{font:italic 800 12px/16px var(--round);color:var(--mute)}
.fl{display:flex;flex-direction:column;gap:8px}
.nt{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding:12px;border-radius:var(--r-md);background:var(--bg-2);align-items:start;border:0;text-align:left;width:100%;cursor:pointer;animation:ntIn .4s ease-out;transition:background .25s}
.nt:hover{background:var(--bg-3)}
.nt .av{width:32px;height:32px}
.nt p{font:400 13px/18px var(--kr);color:var(--ink)}
.nt small{display:block;font:400 11px/15px var(--kr);color:var(--mute);margin-top:4px}
.nt.dit{background:linear-gradient(135deg,#F1E4FC,#FBE8F5)}
.nt.dit:hover{background:linear-gradient(135deg,#E9D6FB,#F8DCEF)}
.nt.open{box-shadow:inset 0 0 0 1.5px #C79BFF}
.nt.static{cursor:default}
@keyframes ntIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

.stage{position:relative;min-height:0;background:radial-gradient(120% 90% at 50% 45%,#FFFFFF 0%,var(--stage) 60%,#EFE5FA 100%);display:grid;grid-template-rows:minmax(0,1fr) auto}
.map{position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}
.wseg{position:absolute;z-index:2;top:12px;left:50%;transform:translateX(-50%)}
.mlg{position:absolute;z-index:2;left:12px;bottom:8px;right:12px;display:flex;flex-wrap:wrap;gap:4px 6px}
.mlg button{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border:0;border-radius:999px;background:rgba(255,255,255,.7);font:600 12px/16px var(--kr);color:var(--ink-2);cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}
.mlg button[aria-pressed="false"]{opacity:.4}
.mlg i{width:9px;height:9px;border-radius:50%}
.mlg .dust i{width:4px;height:4px;border-radius:0;background:#8B7AA6}
.hint{position:absolute;z-index:2;top:56px;left:50%;transform:translateX(-50%);font:500 12px/16px var(--kr);color:var(--mute);white-space:nowrap;pointer-events:none}
.tip{position:absolute;z-index:5;pointer-events:none;max-width:240px;padding:8px 11px;border-radius:12px;background:rgba(22,18,27,.92);font:400 12.5px/1.4 var(--kr);color:#FFFFFF;opacity:0;transition:opacity .15s}
.tip.on{opacity:1}
.tip b{color:#FFFFFF;font-weight:700}
.tip .sub,.tip small{color:#C9BEDA}
.tl{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;padding:8px 16px 12px;border-top:1px solid var(--line);background:rgba(255,255,255,.6)}
.pl{width:40px;height:40px;border-radius:999px;border:0;background:var(--grad);color:#FFFFFF;font-size:13px;cursor:pointer;box-shadow:0 6px 16px -8px rgba(110,30,170,.7),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .35s var(--ease)}
.pl:hover{transform:translateY(-1px)}
.track{position:relative;height:56px}
#tlc{position:absolute;inset:0;width:100%;height:100%;cursor:pointer;touch-action:none}
#tR{position:absolute;left:0;right:0;bottom:-8px;width:100%;opacity:0;height:16px;pointer-events:none}
.track:focus-within{outline:2px solid var(--violet);outline-offset:2px;border-radius:8px}

.tabs{display:flex;gap:4px;padding:12px 16px;position:sticky;top:0;background:var(--bg);z-index:2;border-bottom:1px solid var(--line)}
.tabs button{height:34px;padding:0 14px;border:0;border-radius:999px;background:none;font:600 14px/19px var(--kr);color:var(--ink-2);cursor:pointer;transition:background .25s,color .25s}
.tabs button:hover{background:var(--bg-2)}
.tabs button[aria-selected="true"]{background:var(--night);color:#FFFFFF}
.tp{padding:16px;display:flex;flex-direction:column;gap:12px}
.cn4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cn{padding:14px;border-radius:var(--r-lg);background:var(--bg-2);display:flex;flex-direction:column;gap:2px;min-width:0;min-height:104px}
.cn b{font:italic 900 32px/38px var(--round);letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums}
.cn b small{font:600 12px/16px var(--kr);color:var(--mute);margin-left:3px;font-style:normal}
.cn span{font:400 12px/16px var(--kr);color:var(--mute)}
.cn.dit{background:linear-gradient(135deg,#F1E4FC,#FBE8F5)}
.cn.dit b{color:transparent;background:var(--mark);-webkit-background-clip:text;background-clip:text}
.cn.dit b small{-webkit-text-fill-color:var(--mute)}
.box{padding:14px;border-radius:var(--r-lg);background:var(--bg-2);display:flex;flex-direction:column;gap:8px}
.box h3{font:700 14px/19px var(--kr);color:var(--ink)}
.box canvas{width:100%;height:160px;display:block}
.lgd{display:flex;flex-wrap:wrap;gap:4px 12px;font:500 11px/15px var(--kr);color:var(--mute)}
.lgd span{display:inline-flex;align-items:center;gap:6px}
.lgd i{width:12px;height:3px;border-radius:2px}
.lgd i.dash{background:repeating-linear-gradient(90deg,currentColor 0 3px,transparent 3px 5px)!important}
.ms{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.ms button{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;width:100%;padding:8px;border:0;border-radius:10px;background:none;text-align:left;cursor:pointer;align-items:baseline;transition:background .2s}
.ms button:hover{background:#FFFFFF}
.ms em{font:italic 800 12px/16px var(--round);color:var(--violet-d);font-variant-numeric:tabular-nums}
.ms b{font:500 13px/18px var(--kr);color:var(--ink)}
.pl-g{display:flex;flex-direction:column;gap:2px}
.pl-g h4{font:700 12px/16px var(--kr);color:var(--mute);padding:8px 8px 4px}
.pr{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:8px 12px;align-items:center;width:100%;padding:8px;border:0;border-radius:var(--r-md);background:none;text-align:left;cursor:pointer;transition:background .2s}
.pr:hover{background:var(--bg-2)}
.pr .av{width:32px;height:32px}
.pr span{min-width:0}
.pr b{display:block;font:600 14px/19px var(--kr);color:var(--ink)}
.pr small{display:block;font:400 12px/16px var(--kr);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv{display:flex;flex-direction:column;gap:10px}
.rv details{border-radius:var(--r-lg);background:var(--bg-2);padding:14px 16px}
.rv summary{cursor:pointer;list-style:none;display:flex;flex-direction:column;gap:6px}
.rv summary::-webkit-details-marker{display:none}
.rv summary b{font:700 14px/19px var(--kr);color:var(--ink)}
.rv details > div{display:flex;flex-direction:column;gap:8px;padding-top:8px}
.rv p,.rv li{font:400 13px/19px var(--kr);color:var(--ink-2)}
.rv ul{margin:0;padding-left:16px}
.tag{align-self:flex-start;display:inline-flex;height:22px;align-items:center;padding:0 9px;border-radius:999px;font:600 11px/15px var(--kr)}
.tag.dec{background:#FCE3F1;color:#B5307D}
.tag.pol{background:#EDE3FC;color:#7438C2}
.tag.ref{background:#FFFFFF;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.mini{width:100%;border-collapse:collapse;font:400 12px/16px var(--kr)}
.mini th,.mini td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right}
.mini th{font-weight:600;color:var(--mute)}
.mini th:first-child,.mini td:first-child{text-align:left}
.mini td{font-variant-numeric:tabular-nums;color:var(--ink)}

/* cards */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(22,18,27,.38);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;padding:24px var(--gxr) 24px var(--gx);animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.rc:focus,.rm:focus{outline:none}
.rc{position:relative;width:min(440px,100%);max-height:100%;overflow:auto;border-radius:28px;background:var(--bg);display:flex;flex-direction:column;animation:rise .32s var(--ease);scrollbar-width:thin;box-shadow:0 30px 60px -30px rgba(60,10,90,.45)}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.scrim,.rc,.rm,.nt,.rm-cap .in{animation:none}}
.rc-h{position:relative;padding:20px 56px 18px 20px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(135deg,#F1E4FC 0%,#F6ECFC 50%,#FBE8F5 100%);color:var(--ink)}
.rc-h > *{position:relative;z-index:1}
.rc-x{position:absolute;z-index:3;top:14px;right:14px;width:34px;height:34px;border:0;border-radius:999px;background:#FFFFFF;color:var(--ink);font-size:14px;cursor:pointer;box-shadow:0 4px 12px -6px rgba(22,18,27,.4)}
.pair{display:flex;align-items:center}
.pair .av{width:56px;height:56px;box-shadow:0 0 0 3px #FFFFFF}
.pair .av + .av{margin-left:-12px}
.pair .amp{margin-left:12px;font:600 12px/16px var(--kr);color:var(--mute)}
.rc-h h2{font:800 28px/36px var(--kr);letter-spacing:-.03em}
.rc-h p{font:500 13px/18px var(--kr);color:var(--ink-2)}
.badge{align-self:flex-start;display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:999px;background:var(--night);color:#FFFFFF;font:700 12px/16px var(--kr)}
.badge.dit{background:var(--grad);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.rc-b{padding:18px 20px 20px;display:flex;flex-direction:column;gap:22px}
.rc-b h3{font:700 13px/18px var(--kr);color:var(--mute);margin-bottom:10px}
.rc-b h3 small{font-weight:400;color:var(--faint);margin-left:6px}
.lvrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.lvrow .ar,.row .ar{color:var(--faint)}
.lvrow small{display:block;width:100%;font:400 12px/16px var(--kr);color:var(--mute);margin-top:2px}
.mix{display:flex;height:8px;border-radius:999px;overflow:hidden;gap:2px;margin-bottom:10px}
.mixl{display:flex;flex-wrap:wrap;gap:4px 12px;font:400 12px/16px var(--kr);color:var(--ink-2)}
.mixl span{display:inline-flex;align-items:center;gap:6px}
.mixl i{width:8px;height:8px;border-radius:50%}
.wo{padding:14px;border-radius:var(--r-md);background:var(--bg-2);font:400 13px/19px var(--kr);color:var(--ink-2)}
.wo b{color:var(--ink)}
.rc-f{display:flex;justify-content:space-between;gap:8px;padding:12px 20px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--bg);z-index:4}
.rc-f button{height:38px;padding:0 16px;border:0;border-radius:999px;background:var(--bg-2);font:600 13px/18px var(--kr);color:var(--ink);cursor:pointer;transition:background .2s}
.rc-f button:hover{background:var(--bg-3)}
.rc-f button:disabled{opacity:.35;cursor:default}
.rc-f span{align-self:center;font:italic 800 13px/16px var(--round);color:var(--mute)}
.pkv{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px 12px;margin:0;font:400 13px/19px var(--kr);color:var(--ink-2)}
.pkv dt{color:var(--mute);font-weight:600}
.pkv dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:999px;background:var(--bg-2);font:500 12px/16px var(--kr);color:var(--ink)}
.quote{padding:14px;border-radius:var(--r-md);background:linear-gradient(135deg,#F1E4FC,#FBE8F5);color:#4B2470;font:500 13px/19px var(--kr)}
.brow{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px;align-items:start;font:400 13px/19px var(--kr);color:var(--ink-2)}

/* relationship media: a lavender stage replays the pair's story (balls = interactions, fanned to both people), chapters alongside */
.rm{position:relative;width:min(1160px,100%);height:min(780px,100%);border-radius:28px;background:var(--bg);display:grid;grid-template-columns:minmax(0,1fr) 380px;overflow:hidden;animation:rise .32s var(--ease);box-shadow:0 30px 60px -30px rgba(60,10,90,.45)}
.rm-st{position:relative;background:radial-gradient(110% 90% at 50% 48%,#FFFFFF 0%,var(--stage) 62%,#EEE3FA 100%);display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;min-width:0}
.rm-cw{position:relative;min-height:0;overflow:hidden}
#rmCv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}
.rm-lg{position:absolute;top:18px;left:18px;display:flex;flex-direction:column;gap:4px;font:500 11px/15px var(--kr);color:var(--mute);pointer-events:none}

<script>
(function(){

  }
  function mul(seed){ return function(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }

  let W = 0, H = 0, DPR = 1, CX = 0, CY = 0, R0 = 0, rotY = .5, rotX = -.3, vy = 0, drag = null, idleAt = 0, hits = [];

  BALL.forEach(t => { const col = S.TYPES[t].c, c = document.createElement('canvas'); c.width = c.height = 96; const g = c.getContext('2d'), gr = g.createRadialGradient(34, 30, 1, 48, 48, 47); gr.addColorStop(0, mix(col, '#FFFFFF', .92)); gr.addColorStop(.16, mix(col, '#FFFFFF', .45)); gr.addColorStop(.55, col); gr.addColorStop(1, mix(col, '#000000', .6)); g.fillStyle = gr; g.beginPath(); g.arc(48, 48, 47, 0, 7); g.fill(); SPR[t] = c; });

  const tAt = x => { const b = tlc.getBoundingClientRect(); return Math.max(0, Math.min(st.period, (x - b.left - 4) / (b.width - 8) * st.period)); };
  tlc.addEventListener('pointerdown', e => { scrub = { x: e.clientX, moved: false }; try { tlc.setPointerCapture(e.pointerId); } catch (er) {} });
  tlc.addEventListener('pointermove', e => { const b = tlc.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top; tlc.title = (tlDots.find(t => Math.hypot(t.x - x, t.y - y) < 9) || {}).m?.text || ''; if (!scrub) return; if (Math.abs(e.clientX - scrub.x) > 3) scrub.moved = true; if (scrub.moved) { playing = false; $('play').textContent = '▶'; T = Tt = tAt(e.clientX); } });
  tlc.addEventListener('pointerup', e => { if (!scrub) return; const moved = scrub.moved; scrub = null; if (moved) return; const b = tlc.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top, hit = tlDots.find(t => Math.hypot(t.x - x, t.y - y) < 9); playing = false; $('play').textContent = '▶'; if (hit) { T = Tt = Math.floor(hit.m.d) + .95; ui(true); openCard(hit.m.who, { from: tlc }); } else T = Tt = tAt(e.clientX); });

  // ---------------- review ----------------
  function review(){
    const u = REV.uni, h = REV.high, pct = d => Math.round(d['active|v2'].noDitto / d['active|v2'].opened * 100);
    const row = (d, a, lab) => `<tr><td>${lab}</td><td>${d[a + '|v2'].f90}</td><td>${d[a + '|v2'].f180}</td><td>${d[a + '|v2'].fof180}</td></tr>`;
    const card = (tag, cls, title, body, open) => `<details ${open ? 'open' : ''}><summary><span class="tag ${cls}">${tag}</span><b>${title}</b></summary><div>${body}</div></details>`;
    $('rv').innerHTML = `<p class="sub">시드 16개 평균이에요. 지도는 그중 한 번이에요.</p>`
      + card('결정 필요', 'dec', '친구 30명이 한도 정책과 맞지 않아요', `<p>서비스 기획서 §5.15는 기본 15명, Ditto Plus 30명이에요. 10월 17일 전략은 가까운 친구 15명 + 친구 확장층인데 기획서는 그대로예요.</p><p>이 시뮬레이터는 전략 쪽을 따라 친구 중 돈독한 15명을 가까운 친구 자리에, 나머지를 그 바깥에 뒀어요.</p>`, true)
      + card('정책 제안', 'pol', '지금 규칙은 디토 없이도 친구 신청이 열려요', `<p>‘함께한 교류’가 댓글이나 그룹 대화로도 채워져서, 활발 기준 친구의 친구 열림 중 대1 ${pct(u)}%, 고1 ${pct(h)}%가 디토 없이 열렸어요.</p><p><b>디토 필수안</b>(열림 조건에 둘 사이 디토 1번 이상)은 6개월 열림 수가 대1 ${u['active|v2'].opened}→${u['active|ditto'].opened}, 고1 ${h['active|v2'].opened}→${h['active|ditto'].opened}로 거의 같아요. 위 ‘열림 조건’으로 바로 비교해 보세요.</p>`)
      + card('참고', 'ref', '6개월 30명은 활발하게 쓰는 사람 기준이에요', `<table class="mini"><thead><tr><th>현재 v2</th><th>3개월</th><th>6개월</th><th>디토로</th></tr></thead><tbody>${row(u, 'active', '대1 활발')}${row(u, 'normal', '대1 보통')}${row(u, 'light', '대1 가볍게')}${row(h, 'active', '고1 활발')}${row(h, 'normal', '고1 보통')}${row(h, 'light', '고1 가볍게')}</tbody></table><p>첫 열림 중앙값은 대1 ${u['active|v2'].firstOpenMed}일, 고1 ${h['active|v2'].firstOpenMed}일이에요. 기획서의 이전 모델은 41.7일이었어요.</p>`)
      + card('정책 제안', 'pol', '고1은 친구의 친구로 성인이 보여요', `<p>시우의 지도에는 ${h.adults.map(a => `${a.n}(${a.age}세)`).join(', ')}이 친구의 친구로 보일 수 있어요. 방문자 공개와 겹치면 성인이 미성년자의 방문 기록을 봐요.</p><ul><li>만 19세 미만은 친구의 친구 노출·주파수를 만 19세 미만끼리로</li><li>만 19세 미만의 방문 기록은 서로 숨김</li><li>성인이 미성년자에게 먼저 디토·친구 신청 불가</li></ul>`)
      + card('참고', 'ref', '‘더 돈독해졌다’는 아직 가설이에요', `<p>6개월 뒤 가벼운 친구 이상은 대1 ${u['active|v2'].casualW}명(디토 없이 ${u['active|v2'].casualO}), 고1 ${h['active|v2'].casualW}명(${h['active|v2'].casualO})이에요. 앱 교류를 시간으로 바꾼 가정에서 나온 차이예요. 확실한 건 디토로 이어진 친구의 친구가 디토 없이는 생기지 않는다는 점이에요.</p>`)
      + card('가정', 'ref', '이 시뮬레이션의 가정', `<ul><li>돈독함 = 함께 보낸 시간. 50시간 가벼운 친구 · 90시간 친구 · 200시간 가까운 친구 (Hall, 2018). 연락이 없으면 하루 0.12%씩 옅어져요.</li><li>앱 교류 1번 = 디토 15분 · 같은 날 그룹 대화 20분 · 방명록 8분 · 댓글 6분 · 방문 2분 · 리액션 1분</li><li>주파수는 정책 v2 그대로. 디토는 21일이 지나도 ×0.3로 남아요.</li><li>오프라인 시간은 학기·시험·방학에 따라 달라지고 두 경우가 같아요.</li><li>앱에서는 점수와 시간을 사용자에게 보여 주지 않아요.</li></ul>`);
  }

  // ---------------- legend · controls ----------------
  function legend(){
    $('mlg').innerHTML = BALL.map(t => `<button type="button" data-t="${t}" aria-pressed="${on[t]}"><i style="background:${S.TYPES[t].c}"></i>${S.TYPES[t].kr}</button>`).join('') + `<button type="button" class="dust" data-t="visit" aria-pressed="${on.visit}"><i></i>방문</button>`;
    $('mlg').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { on[b.dataset.t] = !on[b.dataset.t]; b.setAttribute('aria-pressed', on[b.dataset.t]); }));
  }
  function seg(id, fn){ const el = $(id); el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { el.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); fn(b.dataset.v); })); }
  seg('segP', v => { st.pk = v; run(); });
  seg('segD', v => { st.period = +v; run(true); });
  seg('segA', v => { st.activity = v; run(true); });
  seg('segG', v => { st.gate = v; run(true); });
  seg('segY', v => { st.protect = v === '1'; run(true); });
  seg('segW', v => { st.world = v; lastKey = ''; ui(true); });
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { document.querySelectorAll('.tabs button').forEach(x => { x.setAttribute('aria-selected', x === b); $('tp-' + x.dataset.t).hidden = x !== b; }); if (b.dataset.t === 'sum') drawCharts(); }));
  $('meBtn').addEventListener('click', e => openPersona(e.currentTarget));
  $('tR').addEventListener('input', e => { playing = false; $('play').textContent = '▶'; T = Tt = +e.target.value; });
  $('play').addEventListener('click', () => { if (playing) { playing = false; Tt = T; $('play').textContent = '▶'; return; } if (T >= st.period - .5) { T = 0; r.EV.forEach(e => { e.v = false; }); } Tt = st.period; playing = true; $('play').textContent = '❚❚'; });

  let last = 0;
  function tick(now){
    const dt = Math.min(60, now - (last || now)); last = now;
    if (playing) { T = Math.min(Tt, T + dt / 1000 * (st.period / 30)); if (T >= Tt) { playing = false; $('play').textContent = '▶'; } }
    if (!drag) { vy *= .93; rotY += vy; if (!reduce && now - idleAt > 2200 && !openId) rotY += dt * .00006; }
    draw(now); ui(false); if (rm) rmFrame(now);
    if (scrub || playing) drawTimeline();
    requestAnimationFrame(tick);
  }
  addEventListener('resize', () => { size(); drawCharts(); drawTimeline(); });
  // On ditto.place the address follows the view: /relationship-ontology/{chaewon|siwoo}/{person}/ opens that pair's card.
  // Each of those is a real page with its own link preview; #person still works.
  const ROOT = '/relationship-ontology/', SLUG = { uni: 'chaewon', high: 'siwoo' }, onSite = location.pathname.startsWith(ROOT);
  let booted = false;
  function syncUrl(){
    if (!onSite || !booted) return;
    const u = ROOT + SLUG[st.pk] + '/' + (openId ? openId + '/' : '');
    if (location.pathname !== u || location.hash) history.replaceState(null, '', u);
    document.title = openId ? `${r.me.n} × ${r.people[openId].n} · Ditto!` : `${r.P.label} ${r.me.n}의 6개월 · Ditto!`;
  }
  function fromUrl(){
    const seg = location.pathname.slice(ROOT.length).split('/'), id = decodeURIComponent(location.hash.slice(1)) || seg[1];
    if (r && id && r.people[id] && id !== openId) openCard(id);
  }
  if (onSite) {
    const pk = Object.keys(SLUG).find(k => location.pathname.startsWith(ROOT + SLUG[k] + '/'));
    if (pk && pk !== st.pk) { st.pk = pk; $('segP').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === pk)); }
    addEventListener('hashchange', fromUrl);
  }
  size(); run(); booted = true; fromUrl(); syncUrl(); requestAnimationFrame(tick);
})();
</script>
</body></html>
