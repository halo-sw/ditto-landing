<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ditto! - 통하면 디토해!</title>
<meta name="description" content="위젯으로 서로의 하루를 주고받는 친구들의 공간, ditto!">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ditto.at/">
<meta property="og:title" content="Ditto! - 통하면, 디토해!">
<meta property="og:description" content="위젯으로 서로의 하루를 주고받는 친구들의 공간">
<meta property="og:image" content="https://ditto.at/assets/og-landing.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Ditto! - 통하면, 디토해!">
<meta name="twitter:description" content="위젯으로 서로의 하루를 주고받는 친구들의 공간">
<meta name="twitter:image" content="https://ditto.at/assets/og-landing.png">
<style>
  @font-face {
    font-family: "PP Pangram Rounded";
    src: url("assets/font-1.woff2") format("woff2");
    font-weight: 600; font-style: italic; font-display: swap;
  }
  @font-face {
    font-family: "Pretendard SemiBold";
    src: url("assets/font-2.woff2") format("woff2");
    font-weight: 600; font-display: swap;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    /* 뷰포트 높이에 맞춰 폰 목업 크기가 유동 — 풀스크린에서 스크롤 없이 채움 */
    --phone-w: clamp(210px, 30vh, 290px);
  }
  html, body { height: 100%; }
  body {
    font-family: "Pretendard SemiBold", -apple-system, sans-serif;
    background: linear-gradient(180deg, #b46ce0 0%, #e087e6 22%, #f79fdf 44%, #fdd9f1 62%, #ffffff 82%);
    min-height: 100svh; overflow-x: hidden;
  }
  .stage {
    min-height: 100svh; width: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: clamp(20px, 4vh, 40px) 20px clamp(24px, 4vh, 48px);
    gap: clamp(14px, 2.4vh, 30px);
  }
  .dock {
    background: #161616; border-radius: 24px;
    padding: 11px 13px; display: flex; gap: clamp(6px, 1vw, 11px); flex-shrink: 0;
    box-shadow: 0 14px 34px rgba(30,10,50,.35);
    max-width: 100%;
  }
  .dock img {
    width: clamp(40px, 5.6vw, 52px); height: clamp(40px, 5.6vw, 52px);
    border-radius: 12px; display: block; cursor: pointer;
    transition: transform .18s ease, filter .18s ease; -webkit-tap-highlight-color: transparent;
  }
  .dock img:hover { transform: translateY(-3px); }
  .dock img.active { transform: translateY(-4px); filter: drop-shadow(0 6px 10px rgba(0,0,0,.3)); }
  .type-line {
    height: 1.4em; min-height: 24px;
    font-family: "PP Pangram Rounded", sans-serif; font-style: italic;
    font-size: clamp(15px, 1.4vw, 17px); color: #fff; letter-spacing: .01em;
  }
  .phone-wrap {
    position: relative; overflow: hidden; flex-shrink: 0;
    width: var(--phone-w);
    height: clamp(300px, 52vh, 460px);
    -webkit-mask-image: linear-gradient(180deg, #000 55%, transparent 95%);
    mask-image: linear-gradient(180deg, #000 55%, transparent 95%);
  }
  .phone-wrap img {
    width: var(--phone-w); display: block; position: absolute; top: 0; left: 50%;
    transform: translateX(-50%); transition: opacity .35s ease;
  }
  .phone-wrap img.hidden { opacity: 0; }
  .count {
    font-family: "PP Pangram Rounded", sans-serif; font-style: italic;
    font-size: clamp(22px, 2.2vw, 28.8px); color: #8c5f5f; letter-spacing: .02em; flex-shrink: 0;
  }
  form { display: flex; gap: 14px; align-items: stretch; flex-shrink: 0; }
  input {
    width: clamp(220px, 26vw, 340px); height: 52px; padding: 0 18px;
    border: 1px solid #e2e2e6; border-radius: 10px; background: #f5f5f7;
    font-family: inherit; font-size: 15px; color: #1c1c22; outline: none;
  }
  input::placeholder { color: #a8a8b0; }
  input:focus { border-color: #b46ce0; background: #fff; }
  button {
    height: 52px; padding: 0 26px; border: none; border-radius: 12px;
    background: #b255d9; color: #fff; font-family: "Pretendard SemiBold", sans-serif;
    font-size: 16px; cursor: pointer; transition: background .18s ease; white-space: nowrap;
  }
  button:hover { background: rgba(134, 61, 166, .85); }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .6; }
  .msg { min-height: 20px; font-size: 13px; color: #8c5f5f; text-align: center; flex-shrink: 0; }

  /* 완료 팝업 */
  .modal-back {
    position: fixed; inset: 0; background: rgba(40, 16, 60, .38);
    backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center;
    padding: 24px; z-index: 50; opacity: 0; pointer-events: none; transition: opacity .22s ease;
  }
  .modal-back.show { opacity: 1; pointer-events: auto; }
  .modal {
    width: 100%; max-width: 360px; background: #fff; border-radius: 26px;
    padding: 40px 28px 28px; text-align: center;
    box-shadow: 0 24px 70px rgba(60, 30, 110, .28);
    transform: translateY(12px) scale(.97); transition: transform .24s cubic-bezier(.2,.9,.3,1.2);
  }
  .modal-back.show .modal { transform: translateY(0) scale(1); }
  .modal .emoji { font-size: 46px; margin-bottom: 14px; }
  .modal .title { font-family: "PretendardB", "Pretendard SemiBold", sans-serif; font-size: 21px; font-weight: 700; color: #1c1c22; margin-bottom: 10px; }
  .modal .body { font-size: 14px; color: #6b6b76; line-height: 1.6; }
  .modal .ok {
    margin-top: 26px; width: 100%; height: 52px; border: none; border-radius: 14px;
    background: #b255d9; color: #fff; font-family: "Pretendard SemiBold", sans-serif;
    font-size: 16px; cursor: pointer; transition: background .18s ease;
  }
  .modal .ok:hover { background: rgba(134, 61, 166, .9); }
  .modal .ok:active { transform: scale(.98); }

  /* 세로 모바일: 폼 세로 적층 */
  @media (max-width: 640px) {
    form { flex-direction: column; width: 100%; max-width: 340px; }
    input, button { width: 100%; }
  }
  /* 가로가 낮은 화면(가로 모바일·짧은 창): 폰을 더 줄이고 여백 압축 */
  @media (max-height: 620px) {
    :root { --phone-w: clamp(150px, 24vh, 210px); }
    .stage { gap: clamp(8px, 1.6vh, 16px); }
    .phone-wrap { height: clamp(180px, 34vh, 300px); }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="dock" id="dock">
      <img src="assets/icon-1.png" data-phone="1" alt="ditto 화면 1">
      <img src="assets/icon-2.png" data-phone="2" alt="ditto 화면 2">
      <img src="assets/icon-3.png" data-phone="3" alt="ditto 화면 3">
      <img src="assets/icon-4.png" data-phone="4" alt="ditto 화면 4">
      <img src="assets/icon-5.png" data-phone="5" alt="ditto 화면 5">
      <img src="assets/icon-6.png" data-phone="2" alt="ditto 화면 6">
      <img src="assets/icon-7.png" data-phone="1" alt="ditto 화면 7">
    </div>
    <div class="type-line"><span id="type"></span>&thinsp;_</div>
    <div class="phone-wrap">
      <img id="phoneA" src="assets/phone-1.png" alt="ditto! 앱 화면">
      <img id="phoneB" class="hidden" alt="" aria-hidden="true">
    </div>
    <div class="count" id="count">00:00:00:00</div>
    <form id="wl">
      <input type="email" id="email" placeholder="name@email.com" autocomplete="email">
      <button type="submit" id="btn">출시알림 받기</button>
    </form>
    <div class="msg" id="msg"></div>
  </main>

  <div class="modal-back" id="modalBack">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="emoji" id="modalEmoji">💌</div>
      <div class="title" id="modalTitle">완료되었어요!</div>
      <div class="body" id="modalBody">출시 소식을 가장 먼저 보내드릴게요.</div>
      <button class="ok" id="modalOk">확인</button>
    </div>
  </div>
<script>
  // 타이프라이터 — Framer 원본 문구 (실측: 타이핑 52ms · 삭제 137ms · 휴지 2s)
  const PHRASES = ["This is all about", "Catch ya on Ditto!", "❤️‍🔥🍞🌎🤍⭐️"];
  const typeEl = document.getElementById('type');
  let pi = 0, ci = 0, deleting = false;
  function tick() {
    const p = [...PHRASES[pi]];
    if (!deleting) {
      ci++;
      if (ci >= p.length) { deleting = true; typeEl.textContent = p.join(''); setTimeout(tick, 2000); return; }
    } else {
      ci--;
      if (ci <= 0) { deleting = false; pi = (pi + 1) % PHRASES.length; }
    }
    typeEl.textContent = p.slice(0, ci).join('');
    setTimeout(tick, deleting ? 137 : 52);
  }
  tick();

  // 독 아이콘 클릭 → 폰 화면 전환 (A/B 크로스페이드)
  const phoneA = document.getElementById('phoneA'), phoneB = document.getElementById('phoneB');
  let front = phoneA, back = phoneB, current = '1';
  document.getElementById('dock').addEventListener('click', e => {
    const icon = e.target.closest('img[data-phone]');
    if (!icon) return;
    const n = icon.dataset.phone;
    document.querySelectorAll('#dock img').forEach(i => i.classList.toggle('active', i === icon));
    if (n === current) return;
    current = n;
    back.onload = () => {
      back.classList.remove('hidden');
      front.classList.add('hidden');
      [front, back] = [back, front];
    };
    back.src = `assets/phone-${n}.png`;
  });

  // 카운트다운 — 출시일 확정 시 LAUNCH_AT을 ISO 문자열로 (null이면 00:00:00:00 고정)
  const LAUNCH_AT = null; // 예: "2026-09-01T00:00:00+09:00"
  const countEl = document.getElementById('count');
  const pad = n => String(n).padStart(2, '0');
  function updateCount() {
    if (!LAUNCH_AT) return;
    const diff = Math.max(0, new Date(LAUNCH_AT) - new Date());
    const d = Math.floor(diff / 86400000), h = Math.floor(diff / 3600000) % 24,
          m = Math.floor(diff / 60000) % 60, s = Math.floor(diff / 1000) % 60;
    countEl.textContent = `${pad(d)}:${pad(h)}:${pad(m)}:${pad(s)}`;
  }
  updateCount(); setInterval(updateCount, 1000);

  // 출시알림 — Supabase waitlist (publishable key, RLS: insert만 허용)
  const SB = "https://lisqekczixwzshmpewzq.supabase.co/rest/v1/waitlist";
  const KEY = "sb_publishable_wZhXPAWXra62J60VkWJlhQ_2OPv-Zpf";
  const form = document.getElementById('wl'), btn = document.getElementById('btn'),
        email = document.getElementById('email'), msg = document.getElementById('msg');
  const modalBack = document.getElementById('modalBack');
  function showModal(emoji, title, body) {
    document.getElementById('modalEmoji').textContent = emoji;
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').textContent = body;
    modalBack.classList.add('show');
  }
  function closeModal() { modalBack.classList.remove('show'); }
  document.getElementById('modalOk').addEventListener('click', closeModal);
  modalBack.addEventListener('click', e => { if (e.target === modalBack) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  form.addEventListener('submit', async e => {
    e.preventDefault();
    btn.disabled = true; msg.textContent = '';
    try {
      const r = await fetch(SB, {
        method: 'POST',
        headers: { apikey: KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email.value.trim() })
      });
      if (r.status === 201) { showModal('💌', '완료되었어요!', '출시 소식을 가장 먼저 보내드릴게요.'); form.reset(); }
      else if (r.status === 409) { showModal('🙌', '이미 신청했어요', '출시되면 이 이메일로 알려드릴게요.'); }
      else { msg.textContent = '잠시 후 다시 시도해주세요.'; }
    } catch { msg.textContent = '네트워크 연결을 확인해주세요.'; }
    btn.disabled = false;
  });
</script>
</body>
</html>
