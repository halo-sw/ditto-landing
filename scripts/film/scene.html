<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden;background:#0D0914}
.shot{position:absolute;inset:0;overflow:hidden;opacity:0}
.shot>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tint{position:absolute;inset:0}
.amb{position:absolute;left:-20%;top:-20%;width:140%;height:140%;object-fit:cover;filter:blur(60px) saturate(1.7);opacity:.38;mix-blend-mode:screen}
.dim{position:absolute;inset:0;background:radial-gradient(80% 75% at 50% 48%,rgba(13,9,20,0),rgba(13,9,20,.6))}
.fg{position:absolute;left:50%;top:50%;width:340px;margin-left:-170px;transform-origin:50% 50%;filter:drop-shadow(0 60px 70px rgba(0,0,0,.6));will-change:transform}
.sheen{position:absolute;inset:0;background:linear-gradient(105deg,rgba(255,255,255,0) 42%,rgba(255,255,255,.13) 50%,rgba(255,255,255,0) 58%);mix-blend-mode:screen}
.vig{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%)}
#grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay}
</style></head><body>
<div class="shot" id="A"><img class="bg" id="Aimg" src="../../assets/bg-friends.jpg"><div class="vig"></div></div>
<div class="shot" id="B"><div class="tint" style="background:radial-gradient(70% 80% at 50% 55%,#6A45B8 0%,#2E1C58 60%,#170F2C 100%)"></div><img class="amb" src="../../assets/v6-s-platter.webp"><div class="dim"></div><img class="fg" src="../../assets/v6-s-platter.webp"><div class="sheen"></div><div class="vig"></div></div>
<div class="shot" id="C"><div class="tint" style="background:radial-gradient(70% 80% at 50% 55%,#9A3F8C 0%,#451A4C 60%,#1D0F26 100%)"></div><img class="amb" src="../../assets/v6-s-ditto.webp"><div class="dim"></div><img class="fg" src="../../assets/v6-s-ditto.webp"><div class="sheen"></div><div class="vig"></div></div>
<div class="shot" id="D"><div class="tint" style="background:radial-gradient(70% 80% at 50% 55%,#4E50C8 0%,#22235E 60%,#100F2A 100%)"></div><img class="amb" src="../../assets/v6-s-freq.webp"><div class="dim"></div><img class="fg" src="../../assets/v6-s-freq.webp"><div class="sheen"></div><div class="vig"></div></div>
<canvas id="grain" width="320" height="180" style="width:1280px;height:720px"></canvas>
<script>
/* A product film made only from a photo and three real app screens: slow camera moves, no drawn UI.
   Render frames with scripts/film/render.js, then encode with ffmpeg (see notes/LANDING_POLISH_LOG.md). */
const T = 12, $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), seg = (t, a, b) => clamp((t - a) / (b - a));
const eio = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2, mix = (a, b, k) => a + (b - a) * k;
const win = { A: [0, 3.2], B: [2.7, 6.1], C: [5.6, 9.1], D: [8.6, 12] }, FADE = .6;
/* each screen: [x, y, scale, rotate] at the start and end of its shot — a slow push toward the part that matters */
const cam = {            // [focus x, focus y (0..1 of the screen), scale, rotate] at the start and end of the shot
  B: [[.5, .36, 1.15, -1.2], [.5, .64, 1.7, .8]],   // the whole platter, drifting down through the widgets
  C: [[.5, .32, 1.25, 1.2], [.5, .80, 1.95, -.6]],    // from the friend's room down to the ditto button
  D: [[.5, .58, 1.2, -.8], [.5, .26, 2.0, .5]]     // up to the live frequency row
};
const gr = $('grain').getContext('2d'); let seed = 1; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function alpha(k, t) { const [a, b] = win[k]; return Math.min(k === 'A' ? 1 : seg(t, a, a + FADE), 1 - seg(t, b - FADE, b)); }
function render(t) {
  t = ((t % T) + T) % T;
  const loop = seg(t, 11.4, 12), tA = t > 6 ? 0 : t;
  $('A').style.opacity = Math.max(alpha('A', t), loop); $('A').style.zIndex = t > 6 ? 5 : 1;
  $('Aimg').style.transform = `scale(${(1.06 + tA * .034).toFixed(4)}) translate(${(-tA * .5).toFixed(2)}%,${(tA * .35).toFixed(2)}%)`;
  ['B', 'C', 'D'].forEach((k, i) => {
    const el = $(k), [a, b] = win[k], u = seg(t, a, b), e = eio(u), [p, q] = cam[k];
    el.style.opacity = alpha(k, t) * (k === 'D' ? 1 - loop : 1); el.style.zIndex = 2 + i;
    const fx = mix(p[0], q[0], e), fy = mix(p[1], q[1], e), s = mix(p[2], q[2], e);
    el.querySelector('.fg').style.transform = `translate(${(-(fx - .5) * 340 * s).toFixed(1)}px,${(-(fy - .5) * 724 * s - 362).toFixed(1)}px) scale(${s.toFixed(4)}) rotate(${mix(p[3], q[3], e).toFixed(3)}deg)`;
    el.querySelector('.amb').style.transform = `translate(${(u * -3).toFixed(2)}%,${(u * 4).toFixed(2)}%)`;
    el.querySelector('.sheen').style.transform = `translateX(${mix(-70, 70, u).toFixed(1)}%)`;
    el.querySelector('.fg').style.filter = `drop-shadow(0 60px 70px rgba(0,0,0,.6)) blur(${((1 - Math.min(seg(t, a, a + FADE), 1 - seg(t, b - FADE, b))) * 7).toFixed(2)}px)`;
  });
  seed = 1 + Math.floor(t * 30);
  const im = gr.createImageData(320, 180);
  for (let i = 0; i < im.data.length; i += 4) { const v = 255 * rnd(); im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  gr.putImageData(im, 0, 0);
}
window.render = render; render(0);
</script></body></html>
